name: Model deprecation audit

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: model-deprecation-audit
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reconcile the catalog against every provider's live model list / direct
      # probe. Provider secrets are resolved centrally from Braintrust using a
      # single Braintrust API key — there are no per-provider secrets here.
      - name: Reconcile provider model lists
        id: reconcile
        env:
          BRAINTRUST_CI_API_KEY: ${{ secrets.BRAINTRUST_CI_API_KEY }}
        run: |
          set -euo pipefail
          pnpm exec tsx packages/proxy/scripts/reconcile_provider_models.ts \
            --output "$RUNNER_TEMP/deprecations.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Apply deprecations to the catalog
        if: steps.reconcile.outputs.change_count != '0'
        env:
          DEPRECATION_COUNT: ${{ steps.reconcile.outputs.deprecation_count }}
          RETIREMENT_COUNT: ${{ steps.reconcile.outputs.retirement_count }}
        run: |
          set -euo pipefail
          write_args=()
          if [ "$DEPRECATION_COUNT" != "0" ] || [ "$RETIREMENT_COUNT" != "0" ]; then
            write_args+=(--write)
          fi
          pnpm exec tsx packages/proxy/scripts/apply_deprecations.ts \
            --report "$RUNNER_TEMP/deprecations.json" \
            --summary-output "$RUNNER_TEMP/lifecycle-summary.md" "${write_args[@]}"

      - name: Canonicalize model list
        id: canonicalize
        if: steps.reconcile.outputs.change_count != '0'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          pnpm exec tsx packages/proxy/scripts/sync_models.ts normalize-local-models --write
          if ! git diff --quiet; then
            git diff > "$RUNNER_TEMP/lifecycle.diff"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deprecation summary
        if: steps.reconcile.outputs.change_count != '0'
        run: |
          set -euo pipefail
          {
            echo "## Model deprecation audit"
            echo
            echo "The audit proposes provider removals based on authoritative model lists or provider probes. Responses that indicate a possible access restriction are inconclusive. Models that lose all providers are marked retired. Azure follows its own retirement schedule and is report-only, alongside Bedrock, Databricks, Fireworks, and Vertex."
            echo
            cat "$RUNNER_TEMP/lifecycle-summary.md"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/deprecations.json"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/lifecycle-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lifecycle evidence and proposed diff
        if: "!cancelled() && steps.reconcile.outcome == 'success'"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lifecycle-audit
          path: |
            ${{ runner.temp }}/deprecations.json
            ${{ runner.temp }}/lifecycle-summary.md
            ${{ runner.temp }}/lifecycle.diff
          if-no-files-found: error

      - name: Validate model schema
        if: steps.canonicalize.outputs.changed == 'true'
        run: pnpm exec vitest run packages/proxy/schema/models.test.ts packages/proxy/schema/index.test.ts packages/proxy/scripts/sync_models.test.ts packages/proxy/scripts/model_deprecation.test.ts

      - name: Create PR
        if: steps.canonicalize.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: chore/model-deprecation-audit
          commit-message: "chore: sync model lifecycle with providers"
          title: "chore: sync model lifecycle with providers"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            packages/proxy/schema/model_list.json
            packages/proxy/schema/index.ts
            packages/proxy/scripts/deprecated_model_ids.json
