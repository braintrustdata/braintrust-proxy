name: Add model

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider serving the model"
        required: true
        type: string
      model_slug:
        description: "Exact provider model slug"
        required: true
        type: string
      refresh:
        description: "Regenerate the existing open add-model PR"
        type: boolean
        default: false
  repository_dispatch:
    types:
      - add-model

concurrency:
  group: add-model-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.provider || inputs.provider }}/${{ github.event_name == 'repository_dispatch' && github.event.client_payload.model_slug || inputs.model_slug }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      provider: ${{ steps.target.outputs.provider }}
      model_slug: ${{ steps.target.outputs.model_slug }}
      proceed: ${{ steps.target.outputs.proceed }}
    steps:
      - name: Validate target model and check for an open generated PR
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          INPUT_PROVIDER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.provider || inputs.provider }}
          INPUT_MODEL_SLUG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.model_slug || inputs.model_slug }}
          MANUAL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh }}
        with:
          script: |
            const providers = new Set([
              "anthropic",
              "azure",
              "baseten",
              "bedrock",
              "cerebras",
              "databricks",
              "fireworks",
              "google",
              "groq",
              "mistral",
              "openai",
              "openrouter",
              "perplexity",
              "together",
              "vertex",
              "xai",
            ]);
            const provider = (process.env.INPUT_PROVIDER || "").toLowerCase();
            const modelSlug = process.env.INPUT_MODEL_SLUG || "";
            // Baseten lists this nonexistent model; block API and agent additions.
            if (modelSlug === "deepseek-ai/DeepSeek-V4.1-Flash-Fast") {
              throw new Error(`Blocked model slug: ${modelSlug} (not a real model)`);
            }
            if (!providers.has(provider)) {
              throw new Error(`Unsupported provider: ${provider}`);
            }
            if (
              modelSlug.length === 0 ||
              modelSlug.length > 160 ||
              !/^[A-Za-z0-9._:/@+-]+$/.test(modelSlug)
            ) {
              throw new Error("Model slug must be 1-160 characters of [A-Za-z0-9._:/@+-]");
            }
            const branchSlug = modelSlug
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 80);
            const branch = `chore/add-model-${provider}-${branchSlug}`;
            core.setOutput("branch", branch);
            core.setOutput("provider", provider);
            core.setOutput("model_slug", modelSlug);
            if (process.env.MANUAL_REFRESH !== "true") {
              const { owner, repo } = context.repo;
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: "open",
                base: "main",
                head: `${owner}:${branch}`,
                per_page: 1,
              });
              if (pulls.length > 0) {
                core.notice(`Skipping ${provider}/${modelSlug}: generated PR #${pulls[0].number} is open.`);
                core.setOutput("proceed", "false");
                return;
              }
            }
            core.setOutput("proceed", "true");

  add:
    needs: target
    if: needs.target.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      # Route Claude Code through the Braintrust gateway. The gateway
      # authenticates with a Braintrust API key (BRAINTRUST_AGENT_SPEND_API_KEY,
      # passed as anthropic_api_key below) and calls the provider on our behalf.
      # https://docs.braintrust.dev/deploy/gateway
      ANTHROPIC_BASE_URL: https://gateway.braintrust.dev
      # Attribute gateway spend to the automations-spend-control project.
      ANTHROPIC_CUSTOM_HEADERS: |-
        x-bt-project-name: automations-spend-control
        x-bt-spend-control-tags: {"job_name":"add-model"}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select a priced provider endpoint
        id: priced_endpoint
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PROVIDER: ${{ needs.target.outputs.provider }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        with:
          script: |
            const provider = process.env.PROVIDER;
            const endpointAvailable =
              (provider === "groq" && Boolean(process.env.GROQ_API_KEY)) ||
              (provider === "baseten" && Boolean(process.env.BASETEN_API_KEY)) ||
              (provider === "xai" && Boolean(process.env.XAI_API_KEY)) ||
              provider === "cerebras";
            core.setOutput("available", String(endpointAvailable));

      - name: Add from Groq's priced model endpoint
        if: needs.target.outputs.provider == 'groq' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ needs.target.outputs.model_slug }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-groq-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from Baseten's priced model endpoint
        if: needs.target.outputs.provider == 'baseten' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ needs.target.outputs.model_slug }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-baseten \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from xAI's priced model endpoint
        if: needs.target.outputs.provider == 'xai' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ needs.target.outputs.model_slug }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-xai-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from Cerebras's priced model endpoint
        if: needs.target.outputs.provider == 'cerebras' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ needs.target.outputs.model_slug }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-cerebras-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Check whether a priced endpoint added the target
        id: direct_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/proxy/schema/model_list.json packages/proxy/schema/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          mkdir -p "$RUNNER_TEMP/pre-research-catalog"
          cp packages/proxy/schema/{model_list.json,index.ts} "$RUNNER_TEMP/pre-research-catalog/"

      - name: Set up Braintrust Claude Code tracing
        id: claude_trace
        continue-on-error: true
        env:
          BT_TRACE_PROJECT: add-new-model-agent-logs
        run: python3 -B .github/scripts/claude_trace/setup_claude_trace.py

      - name: Add target and cloud companion entries with Claude Code
        id: research
        timeout-minutes: 12
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_PROXY_TRACE_API_KEY }}
          BT_TRACE_ROOT_NAME: ${{ needs.target.outputs.provider }}/${{ needs.target.outputs.model_slug }} · run ${{ github.run_number }}
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_AGENT_SPEND_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: braintrust-bot
          display_report: "true"
          claude_args: |
            ${{ steps.claude_trace.outcome == 'success' && format('--plugin-dir "{0}"', steps.claude_trace.outputs.plugin_dir) || '' }}
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,WebSearch,WebFetch,Edit,Write"
            --disallowedTools "Bash,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            # Goal

            Add the requested model and all cloud companion entries established by prior models in the same family to the Braintrust proxy catalog.

            - Provider: `${{ needs.target.outputs.provider }}`
            - Model slug: `${{ needs.target.outputs.model_slug }}`
            - A priced endpoint already added or updated the target: `${{ steps.direct_changes.outputs.changed }}`

            # Scope

            - This task explicitly authorizes catalog and provider-mapping work in this repository. Edit only `packages/proxy/schema/model_list.json` and `packages/proxy/schema/index.ts`.
            - The requested model and its cloud/provider companion entries are the only models in scope. Do not remove models or modify unrelated models or source files.
            - Decision models are supported catalog entries. If provider metadata or official documentation identifies the target as a decision model or System One model (typed choices, probabilities, or scores instead of generated text), add it with `flavor: "decisions"` (the exact schema value, not `"decision"` or `"chat"`). This includes `decision-models/*` slugs and `accounts/fireworks/models/rune`. Do not reject a model because it does not generate text. Serverless availability and zero output-token pricing alone do not establish a model's flavor.
            - If a priced endpoint already added or updated the target, preserve its verified metadata and skip target availability/standard-pricing research. Still verify its flavor, correct a default `"chat"` flavor to `"decisions"` for decision models, check provider/tier pricing, and add its cloud companions.
            - If the target slug already exists for another provider, verify the requested provider for the target entry, then union it into the existing entry and provider mapping. Preserve other fields and providers, and still add cloud companions.
            - If the target already exists for the requested provider, still ensure all cloud companions, mappings, and fallback links exist.

            # Research and entry requirements

            Voice, speech, realtime, and live models with officially verified non-token pricing (for example, per-minute pricing) may be added without token prices. Never convert non-token rates to token prices.

            1. Read neighboring entries plus `packages/proxy/schema/models.ts`, `packages/proxy/schema/index.ts`, and `.github/model-pricing.md` to match the catalog schema and provider-mapping conventions.
            2. Unless a priced endpoint already added or updated the target, verify that the requested target model is publicly available through the requested provider's shared inference surface using official provider sources. The cloud-companion assumptions below are an explicit exception for availability and IDs only.
            3. Unless a priced endpoint already added or updated the target, look up official public on-demand pricing for the exact model, provider, and inference surface. Apply the same rule independently to each companion, including regional variants. Add only top-level prices verified by an official source for that provider and omit unverified fields. Never copy prices from another provider, surface, or model, or use third-party sources, free tiers, batch pricing, promotional pricing, or reserved capacity. Preserve existing prices on unchanged routes. If adding a route to a priced entry, verify existing default prices for the new route too; omit any prices that do not apply across the entry's routes.
            4. Add a complete, schema-valid target entry using verified values only. Include token limits, capabilities, and lifecycle metadata only when official sources make them clear; omit uncertain fields.
               Verify token limits already populated by a provider script as well. Use the exact model or documented snapshot's explicit input and output caps, and check them against the total context window. If the sources conflict, report the conflict and cite the sources in the model validation prompt.
               For capability flags, use only official evidence for the exact model ID on the specific provider and inference surface (e.g. Fireworks Serverless, not a dedicated deployment). Do not inherit capabilities from the base model or a companion. Explicit provider negatives win over positives; omit unsupported or uncertain flags, including flags from earlier sync steps.
            5. Add the matching provider mapping in `packages/proxy/schema/index.ts`. Preserve the existing JSON formatting and field ordering; do not manually reorder entries, because the next workflow step applies the repository's canonical model ordering and regenerates the provider index.
            6. For the target and every new or existing companion, add or refresh provider/tier `pricing` following `.github/model-pricing.md`, even when a priced endpoint handled the target or the model already exists.
               Check batch, fast, ultrafast, flex, and priority independently on each provider. Batch uses a separate API on many providers; fast can use `service_tier`, `speed`, or a different upstream `model_id`. Record only verified rates and conditions, and report unsupported or unresolved checks. Use explicit same-model/provider aliases for verified tier synonyms; update the target array only.
            7. Verify the target's flavor against official model documentation even if it already exists or a priced endpoint handled it. Decision targets and all their companion entries must have `flavor: "decisions"`. Use each provider's documented format; do not assume every decision model uses the `typesafe` format. Set `supports_decisions` only when official documentation confirms support for the schema's `POST /v1/decisions` capability.
            8. Include a verified, human-friendly `displayName` for new entries other than `ft:` pricing templates. Check official pricing, deprecation, and changelog pages as well as model cards; a missing model card does not mean the exact ID or name is undocumented. Leave the name unset if it cannot be verified rather than guessing.

            # Required cloud companion entries

            After the target entry exists, always add its cloud companions, including when a priced endpoint handled the target or the target was already present. This is part of adding the model, not optional follow-up research.

            - Read prior models in the same family and follow every established cloud/provider surface for that family, including Bedrock, Vertex, OpenRouter, Azure, and Databricks wherever prior entries establish a convention. Do not invent a new provider integration for a family with no prior entries.
            - Assume the new model is available on those established surfaces. Derive each exact catalog slug by applying the same transformation used for previous models in that family. Do not wait for cloud documentation, an API listing, region access, or credentials to establish availability. These availability and slug assumptions are explicitly authorized for cloud companions.
            - For modern Claude models with fixed, undated IDs, follow the current Claude 5.5 conventions: `anthropic.<target-slug>` on Bedrock; `global.`, `us.`, `eu.`, `au.`, and `jp.` Bedrock variants; `publishers/anthropic/models/<target-slug>` on Vertex; and `anthropic/claude-<family>-<major>.<minor>` on OpenRouter. Match modern undated examples rather than introducing legacy date or `-v1:0` suffixes. For other model families or version styles, use their own previous cloud entries rather than the Claude transformation.
            - Copy the target's flavor, token limits and capabilities; use each provider's established format, provider metadata, and display-name conventions. Preserve existing companion providers and unrelated metadata. Do not copy the target's provider list, parent, fallback links, or provider-specific lifecycle/region fields blindly.
            - Add every companion's provider mapping in `packages/proxy/schema/index.ts`. Set regional Bedrock entries' parent to the Bedrock base entry. Union all companion IDs into the target's `fallback_models`, preserving existing links and avoiding duplicates. Never leave a fallback pointing to a missing entry.
            - If the request itself names a cloud/provider-specific slug, identify the underlying model using prior family entries and complete the same family of companion entries. Do not double-prefix an already qualified slug.
            - If no target entry can be added because its original availability remains unresolved, leave the catalog unchanged and explain why. Do not create cloud companions without a target entry.

            # Canonical provider verification

            Treat the following pages as authoritative provider sources. For the requested provider, inspect the applicable canonical page directly before concluding that the model or its pricing cannot be verified, even if searches or other official pages return nothing:

            - **OpenAI**: Always inspect `https://developers.openai.com/api/docs/models`, follow the relevant model page or catalog data, and check the official pricing linked from the model documentation.
            - **Anthropic**: Always inspect `https://platform.claude.com/docs/en/about-claude/pricing` and follow the relevant official model documentation linked from that page.
            - **Google Gemini**: Always inspect `https://ai.google.dev/gemini-api/docs/pricing`, follow the relevant official model documentation linked from that page, and verify that the pricing applies to the requested Gemini API model and usage tier.

            Search engines are discovery aids only. Do not conclude that the target is unavailable merely because a general search returned no results, a site-restricted search did not find it, another marketing or pricing page omitted it, or a newly published page may not yet be indexed. Verify the exact target model and requested inference surface from the canonical provider page and its linked official documentation. Omit any standard price without an exact-provider source.

            # Model validation prompt

            If you added or changed any catalog entries, write a model validation prompt for the target and its cloud companions to `${{ runner.temp }}/model-validation-prompt.md`, following `.github/model-validation-prompt.md`. The workflow appends it to the pull request description.

            Write a JSON array to `${{ runner.temp }}/model-capability-evidence.json` (empty if there are no claims). For each new true `multimodal`, `o1_like`, `reasoning`, `reasoning_budget`, `supports_streaming`, `supports_decisions`, or `streaming_only` flag, and each such flag on a newly added provider, include one record per official source checked: `{"model":"exact catalog ID","provider":"catalog provider ID","surface":"exact documented inference surface","capability":"catalog field","supported":true,"source":"https://...","quote":"verbatim evidence"}`. For Fireworks, use `"surface":"serverless"`. Include any conflicting negative as `"supported":false`. A model-family description or a different provider/surface is not evidence.
            Quote a complete, verbatim provider statement that names the exact model ID and directly states whether it supports the feature (or requires streaming for `streaming_only`). For Fireworks, the statement itself must identify Serverless. Do not paraphrase or combine separate statements into a quote. Where available, the verifier also checks the provider's model metadata directly.

            Write a JSON array to `${{ runner.temp }}/model-price-evidence.json` (empty if there are no claims). For each new or changed top-level price, include one record per provider route: `{"model":"exact catalog ID","provider":"catalog provider ID","surface":"exact documented inference surface","field":"input_cost_per_mil_tokens","value":0.30,"source":"https://official-provider-page","quote":"verbatim evidence"}`. Use the numeric value in catalog units. When adding a provider route to an entry with an existing top-level price, include a record for the new route too. No records are needed for unchanged prices on unchanged routes, including prices populated by a priced endpoint before research.

            # Final report

            List every official URL checked and, for each requested model, state:

            - whether the exact model slug appeared;
            - which flavor was assigned and the official source supporting that classification;
            - where pricing was found;
            - whether the pricing matches the requested provider and inference surface;
            - which cloud companion slugs, provider mappings, and fallback links were added using the established slug conventions; and
            - if no change was made, the specific target requirement that remains unresolved.

            Do not create issues, pull requests, commits, comments, or files outside the two allowed catalog files, model validation prompt, and evidence files.

      - name: Flush Braintrust trace
        if: always() && steps.claude_trace.outcome == 'success'
        run: bash .github/scripts/claude_trace/flush.sh

      - name: Check whether the target changed the catalog
        id: catalog_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/proxy/schema/model_list.json packages/proxy/schema/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Canonicalize model list and provider index
        if: steps.catalog_changes.outputs.changed == 'true'
        run: pnpm exec tsx packages/proxy/scripts/sync_models.ts normalize-local-models --write

      - name: Verify research and evidence
        env:
          EXECUTION_FILE: ${{ steps.research.outputs.execution_file }}
          CAPABILITY_EVIDENCE_FILE: ${{ runner.temp }}/model-capability-evidence.json
          PRICE_EVIDENCE_FILE: ${{ runner.temp }}/model-price-evidence.json
          PRE_RESEARCH_CATALOG_DIR: ${{ runner.temp }}/pre-research-catalog
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: pnpm exec tsx packages/proxy/scripts/check_model_research.ts

      - name: Check expected files only
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --short)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected=$(git status --porcelain | awk '{print $2}' | grep -vE '^(packages/proxy/schema/model_list\.json|packages/proxy/schema/index\.ts)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files modified:"
            echo "$unexpected"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build proxy package
        if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @braintrust/proxy run build

      - name: Validate model schema
        if: steps.changes.outputs.changed == 'true'
        run: pnpm exec vitest run packages/proxy/schema/models.test.ts packages/proxy/schema/index.test.ts packages/proxy/scripts/sync_models.test.ts packages/proxy/scripts/check_model_research.test.ts

      - name: Check model display names
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          git show HEAD:packages/proxy/schema/model_list.json > "$RUNNER_TEMP/model_list.head.json"
          pnpm exec tsx packages/proxy/scripts/check_model_display_names.ts \
            --before "$RUNNER_TEMP/model_list.head.json" \
            --after packages/proxy/schema/model_list.json \
            --output "$RUNNER_TEMP/model-display-name-report.md"

      - name: Build PR body with model validation prompt
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Automated targeted model-catalog addition from the model-drop workflow." > "$RUNNER_TEMP/pr-body.md"
          if [ -s "$RUNNER_TEMP/model-display-name-report.md" ]; then
            printf '\n' >> "$RUNNER_TEMP/pr-body.md"
            cat "$RUNNER_TEMP/model-display-name-report.md" >> "$RUNNER_TEMP/pr-body.md"
          else
            printf '\n**Action required:** the model display name check did not produce a report. See the workflow logs.\n' >> "$RUNNER_TEMP/pr-body.md"
          fi
          if [ -s "$RUNNER_TEMP/model-validation-prompt.md" ]; then
            {
              printf '\n## Model validation prompt\n\n'
              printf 'Paste this prompt into an agent that has a Braintrust API key to validate these models end to end.\n\n'
              printf '<details>\n<summary>Prompt</summary>\n\n````md\n'
              cat "$RUNNER_TEMP/model-validation-prompt.md"
              printf '\n````\n\n</details>\n'
            } >> "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Verify main still matches the built commit
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin refs/heads/main
          built_commit=$(git rev-parse HEAD)
          current_main=$(git rev-parse FETCH_HEAD)
          if [ "$built_commit" != "$current_main" ]; then
            echo "::error::Built commit $built_commit no longer matches main ($current_main). Rerun add-model from current main."
            exit 1
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ needs.target.outputs.branch }}
          commit-message: "chore: add model to catalog"
          title: "chore: add model to catalog"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: auto-sync
          signoff: false
