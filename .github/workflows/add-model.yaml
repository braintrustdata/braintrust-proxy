name: Add model

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider serving the model"
        required: true
        type: string
      model_slug:
        description: "Exact provider model slug"
        required: true
        type: string
  repository_dispatch:
    types:
      - add-model

concurrency:
  group: add-model
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      # Route Claude Code through the Braintrust gateway. The gateway
      # authenticates with a Braintrust API key (BRAINTRUST_AGENT_SPEND_API_KEY,
      # passed as anthropic_api_key below) and calls the provider on our behalf.
      # https://www.braintrust.dev/docs/deploy/gateway
      ANTHROPIC_BASE_URL: https://gateway.braintrust.dev
      # Attribute gateway spend to the automations-spend-control project, and log
      # the Claude Code LLM traces to the add-new-model-agent-logs project. The
      # gateway auto-creates the project on first log and starts an LLM span for
      # every request that carries x-bt-parent.
      ANTHROPIC_CUSTOM_HEADERS: |-
        x-bt-project-name: automations-spend-control
        x-bt-spend-control-tags: {"job_name":"add-model"}
        x-bt-parent: project_name:add-new-model-agent-logs

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate target model
        id: target
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          INPUT_PROVIDER: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.provider || inputs.provider }}
          INPUT_MODEL_SLUG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.model_slug || inputs.model_slug }}
        with:
          script: |
            const providers = new Set([
              "anthropic",
              "azure",
              "baseten",
              "bedrock",
              "cerebras",
              "databricks",
              "fireworks",
              "google",
              "groq",
              "mistral",
              "openai",
              "openrouter",
              "perplexity",
              "together",
              "vertex",
              "xai",
            ]);
            const provider = (process.env.INPUT_PROVIDER || "").trim().toLowerCase();
            const modelSlug = (process.env.INPUT_MODEL_SLUG || "").trim();
            if (!providers.has(provider)) {
              throw new Error(`Unsupported provider: ${provider}`);
            }
            if (
              modelSlug.length === 0 ||
              modelSlug.length > 160 ||
              !/^[A-Za-z0-9._:/@+-]+$/.test(modelSlug)
            ) {
              throw new Error("Model slug must be 1-160 characters of [A-Za-z0-9._:/@+-]");
            }
            const branchSlug = modelSlug
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 80);
            core.setOutput("branch", `chore/add-model-${provider}-${branchSlug}-${context.runId}`);
            core.setOutput("provider", provider);
            core.setOutput("model_slug", modelSlug);

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.33.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select a priced provider endpoint
        id: priced_endpoint
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PROVIDER: ${{ steps.target.outputs.provider }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        with:
          script: |
            const provider = process.env.PROVIDER;
            const endpointAvailable =
              (provider === "groq" && Boolean(process.env.GROQ_API_KEY)) ||
              (provider === "baseten" && Boolean(process.env.BASETEN_API_KEY)) ||
              (provider === "xai" && Boolean(process.env.XAI_API_KEY)) ||
              provider === "cerebras";
            core.setOutput("available", String(endpointAvailable));

      - name: Add from Groq's priced model endpoint
        if: steps.target.outputs.provider == 'groq' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ steps.target.outputs.model_slug }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-groq-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from Baseten's priced model endpoint
        if: steps.target.outputs.provider == 'baseten' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ steps.target.outputs.model_slug }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-baseten \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from xAI's priced model endpoint
        if: steps.target.outputs.provider == 'xai' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ steps.target.outputs.model_slug }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-xai-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Add from Cerebras's priced model endpoint
        if: steps.target.outputs.provider == 'cerebras' && steps.priced_endpoint.outputs.available == 'true'
        shell: bash
        env:
          INPUT_MODEL_SLUG: ${{ steps.target.outputs.model_slug }}
        run: |
          set -euo pipefail

          pnpm exec tsx packages/proxy/scripts/sync_models.ts sync-cerebras-model \
            --model-slug "$INPUT_MODEL_SLUG" \
            --write

      - name: Check whether a priced endpoint added the target
        id: direct_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/proxy/schema/model_list.json packages/proxy/schema/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add target and cloud companion entries with Claude Code
        timeout-minutes: 12
        uses: anthropics/claude-code-action@fbda2eb1bdc90d319b8d853f5deb53bca199a7c1 # v1.0.140
        with:
          anthropic_api_key: ${{ secrets.BRAINTRUST_AGENT_SPEND_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: braintrust-bot
          display_report: "true"
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,LS,WebSearch,WebFetch,Edit,Write"
            --disallowedTools "Bash,MultiEdit,Replace,NotebookEditCell,mcp__github__create_issue,mcp__github__create_issue_comment,mcp__github__update_issue,mcp__github__create_pr,mcp__github__create_or_update_file,mcp__github__delete_file,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
          prompt: |
            # Goal

            Add the requested model and all cloud companion entries established by prior models in the same family to the Braintrust proxy catalog.

            - Provider: `${{ steps.target.outputs.provider }}`
            - Model slug: `${{ steps.target.outputs.model_slug }}`
            - A priced endpoint already added or updated the target: `${{ steps.direct_changes.outputs.changed }}`

            # Scope

            - This task explicitly authorizes catalog and provider-mapping work in this repository. Edit only `packages/proxy/schema/model_list.json` and `packages/proxy/schema/index.ts`.
            - The requested model and its cloud/provider companion entries are the only models in scope. Do not remove models or modify unrelated models or source files.
            - If a priced endpoint already added or updated the target, preserve its verified metadata and skip target availability/pricing research. Still add its cloud companions.
            - If the target slug already exists for another provider, verify the requested provider for the target entry, then union it into the existing entry and provider mapping. Preserve other fields and providers, and still add cloud companions.
            - If the target already exists for the requested provider, still ensure all cloud companions, mappings, and fallback links exist.

            # Research and entry requirements

            1. Read neighboring entries plus `packages/proxy/schema/models.ts` and `packages/proxy/schema/index.ts` to match the catalog schema and provider-mapping conventions.
            2. Unless a priced endpoint already added or updated the target, verify that the requested target model is publicly available through the requested provider's shared inference surface using official provider sources. The cloud-companion assumptions below are an explicit exception; do not independently verify companion availability, IDs, or prices.
            3. Unless a priced endpoint already added or updated the target, find the provider's official public on-demand pricing for this exact target model. Do not use third-party pricing sources, free tiers, batch pricing, promotional pricing, reserved capacity, or guesses. If pricing cannot be mapped confidently to the local schema, leave the catalog unchanged.
            4. Add a complete, schema-valid target entry using verified values only. Include token limits, capabilities, and lifecycle metadata only when official sources make them clear; omit uncertain fields.
            5. Add the matching provider mapping in `packages/proxy/schema/index.ts`. Preserve the existing JSON formatting and field ordering; do not manually reorder entries, because the next workflow step applies the repository's canonical model ordering and regenerates the provider index.

            # Required cloud companion entries

            After the target entry exists, always add its cloud companions, including when a priced endpoint handled the target or the target was already present. This is part of adding the model, not optional follow-up research.

            - Read prior models in the same family and follow every established cloud/provider surface for that family, including Bedrock, Vertex, OpenRouter, Azure, and Databricks wherever prior entries establish a convention. Do not invent a new provider integration for a family with no prior entries.
            - Assume the new model is available on those established surfaces. Derive each exact catalog slug by applying the same transformation used for previous models in that family. Do not wait for cloud documentation, an API listing, region access, credentials, or an independent price confirmation. These availability, slug, and price assumptions are explicitly authorized for cloud companions.
            - For modern Claude models with fixed, undated IDs, follow the current Claude 5.5 conventions: `anthropic.<target-slug>` on Bedrock; `global.`, `us.`, `eu.`, `au.`, and `jp.` Bedrock variants; `publishers/anthropic/models/<target-slug>` on Vertex; and `anthropic/claude-<family>-<major>.<minor>` on OpenRouter. Match modern undated examples rather than introducing legacy date or `-v1:0` suffixes. For other model families or version styles, use their own previous cloud entries rather than the Claude transformation.
            - Assume prices are identical to the target model on every companion surface. Copy all target pricing fields, including input, output, cache-read, cache-write, 5m cache-write, and 1h cache-write prices when present. Give regional variants the same prices too; do not apply provider or region premiums, omit known prices, or fetch separate cloud pricing.
            - Copy the target's token limits and capabilities; use each provider's established format, provider metadata, and display-name conventions. Preserve existing companion providers and unrelated metadata. Do not copy the target's provider list, parent, fallback links, or provider-specific lifecycle/region fields blindly.
            - Add every companion's provider mapping in `packages/proxy/schema/index.ts`. Set regional Bedrock entries' parent to the Bedrock base entry. Union all companion IDs into the target's `fallback_models`, preserving existing links and avoiding duplicates. Never leave a fallback pointing to a missing entry.
            - If the request itself names a cloud/provider-specific slug, identify the underlying model using prior family entries and complete the same family of companion entries. Do not double-prefix an already qualified slug.
            - If no target entry can be added because its original availability or pricing remains unresolved, leave the catalog unchanged and explain why. Do not create cloud companions without a target entry.

            # Canonical provider verification

            Treat the following pages as authoritative provider sources. For the requested provider, inspect the applicable canonical page directly before concluding that the model or its pricing cannot be verified, even if searches or other official pages return nothing:

            - **OpenAI**: Always inspect `https://developers.openai.com/api/docs/models`, follow the relevant model page or catalog data, and check the official pricing linked from the model documentation.
            - **Anthropic**: Always inspect `https://platform.claude.com/docs/en/about-claude/pricing` and follow the relevant official model documentation linked from that page.
            - **Google Gemini**: Always inspect `https://ai.google.dev/gemini-api/docs/pricing`, follow the relevant official model documentation linked from that page, and verify that the pricing applies to the requested Gemini API model and usage tier.

            The following verification rules apply to the requested target, not to cloud companions generated under the assumptions above. Search engines are discovery aids only. Do not conclude that a model is unavailable merely because a general search returned no results, a site-restricted search did not find it, another marketing or pricing page omitted it, or a newly published page may not yet be indexed. Verify exact model availability and pricing from the applicable canonical provider page and its linked official documentation. If the exact model, requested provider inference surface, or applicable pricing still cannot be verified after those direct checks, do not guess and leave the catalog unchanged.

            # Final report

            List every official URL checked and, for each requested model, state:

            - whether the exact model slug appeared;
            - where pricing was found;
            - whether the pricing matches the requested provider and inference surface;
            - which cloud companion slugs, provider mappings, and fallback links were added using the established slug conventions and identical-price assumption; and
            - if no change was made, the specific target requirement that remains unresolved.

            Do not create issues, pull requests, commits, comments, or files outside the two allowed catalog files.

      - name: Check whether the target changed the catalog
        id: catalog_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/proxy/schema/model_list.json packages/proxy/schema/index.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Canonicalize model list and provider index
        if: steps.catalog_changes.outputs.changed == 'true'
        run: pnpm exec tsx packages/proxy/scripts/sync_models.ts normalize-local-models --write

      - name: Check expected files only
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --short)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected=$(git status --porcelain | awk '{print $2}' | grep -vE '^(packages/proxy/schema/model_list\.json|packages/proxy/schema/index\.ts)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files modified:"
            echo "$unexpected"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build proxy package
        if: steps.changes.outputs.changed == 'true'
        run: pnpm --filter @braintrust/proxy run build

      - name: Validate model schema
        if: steps.changes.outputs.changed == 'true'
        run: pnpm exec vitest run packages/proxy/schema/models.test.ts packages/proxy/schema/index.test.ts packages/proxy/scripts/sync_models.test.ts

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ steps.target.outputs.branch }}
          commit-message: "chore: add model to catalog"
          title: "chore: add model to catalog"
          body: "Automated targeted model-catalog addition from the model-drop workflow."
          labels: auto-sync
          signoff: false
